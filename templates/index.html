<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StyleStore - Tienda Moderna</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f5f5f5;
}

/* HEADER */

header{
    background:#111;
    color:white;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:28px;
}

nav{
    display:flex;
    gap:20px;
    align-items:center;
}

/* LOGIN */

.login-menu{
    position:relative;
}

.btn-login{
    background:transparent;
    color:white;
    border:2px solid #d7261e;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
}

.btn-login:hover{
    background:#d7261e;
}

.login-dropdown{
    position:absolute;
    top:55px;
    right:0;
    width:300px;
    background:#111;
    border-radius:10px;
    padding:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.4);

    opacity:0;
    visibility:hidden;
    transform:translateY(-10px);

    transition:.3s;
    z-index:2000;
}

.login-dropdown.activo{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}

.login-dropdown h3{
    color:#d7261e;
    margin-bottom:20px;
}

.login-dropdown input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:5px;
    background:#222;
    color:white;
}

.btn-ingresar{
    width:100%;
    padding:12px;
    border:none;
    background:#d7261e;
    color:white;
    font-weight:bold;
    border-radius:5px;
    cursor:pointer;
}

nav a{
    color:white;
    text-decoration:none;
}

#btnCarrito{
    background:#d7261e;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

/* HERO */

.hero{
    background:
    linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.4)),
    url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1400&q=80');
    background-size:cover;
    background-position:center;
    color:white;
    text-align:center;
    padding:120px 20px;
}

.hero h2{
    font-size:55px;
}

.hero p{
    margin-top:10px;
    font-size:20px;
}

.products{
    padding:40px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.card-content{
    padding:15px;
    text-align:center;
}

.price{
    color:#d7261e;
    font-size:24px;
    font-weight:bold;
}

.card button{
    margin-top:15px;
    width:100%;
    padding:12px;
    background:black;
    color:white;
    border:none;
    cursor:pointer;
}

.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.55);
    opacity:0;
    visibility:hidden;
    transition:.3s;
    z-index:999;
}

.overlay.activo{
    opacity:1;
    visibility:visible;
}

.carrito{
    position:fixed;
    top:0;
    right:-450px;
    width:420px;
    height:100%;
    background:white;
    transition:.4s;
    z-index:1000;
    display:flex;
    flex-direction:column;
}

.carrito.activo{
    right:0;
}

.carrito-header{
    background:black;
    color:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

#lista-carrito{
    flex:1;
    overflow-y:auto;
    padding:20px;
}


.item-carrito{
    display:flex;
    gap:15px;
    margin-bottom:20px;
    border-bottom:1px solid #ddd;
    padding-bottom:15px;
}

.item-carrito img{
    width:90px;
    height:110px;
    object-fit:cover;
    border-radius:4px;
}

.info-producto{
    flex:1;
}

.info-producto h4{
    font-size:16px;
    margin-bottom:5px;
}

.info-producto p{
    color:#666;
    margin-bottom:5px;
}

.precio-item{
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

.cantidad{
    width:60px;
    padding:5px;
}

.btn-eliminar{
    background:none;
    border:none;
    color:red;
    font-size:20px;
    cursor:pointer;
}

.fila{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    font-size:18px;
}

.total{
    font-weight:bold;
    font-size:24px;
}

.cerrar{
    font-size:28px;
    cursor:pointer;
}


.resumen{
    border-top:1px solid #ddd;
    padding:20px;
}

.btn-finalizar{
    width:100%;
    padding:18px;
    border:none;
    background:#d7261e;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

</style>
</head>
<body>

<header>

<h1>StyleStore</h1>

<nav>

<div class="login-menu">

<button class="btn-login" onclick="toggleLogin()">
Iniciar sesión
</button>

<div class="login-dropdown" id="loginDropdown">

<h3>🔒 ACCESO</h3>

<input type="email" placeholder="Usuario o Email">

<input type="password" placeholder="Contraseña">

<button class="btn-ingresar">
INGRESAR
</button>

</div>

</div>

<a href="#">Tienda</a>
<a href="#">Contacto</a>

<button id="btnCarrito" onclick="mostrarCarrito()">
🛒 Carrito
</button>

</nav>

</header>

<section class="hero">
<h2>Descubre tu estilo</h2>
<p>Moda moderna para todos</p>
</section>

<section class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80">

<div class="card-content">
<h3>Polera Urbana</h3>
<p class="price">S/ 50</p>
<button onclick="agregarCarrito('Polera Urbana',50,'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80')">
Comprar
</button>
</div>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=800&q=80">

<div class="card-content">
<h3>Jeans Clásicos</h3>
<p class="price">S/ 90</p>

<button onclick="agregarCarrito('Jeans Clásicos',90,'https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=800&q=80')">
Comprar
</button>

</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1521223890158-f9f7c3d5d504?auto=format&fit=crop&w=800&q=80">

<div class="card-content">
<h3>Chaqueta Moderna</h3>
<p class="price">S/ 120</p>

<button onclick="agregarCarrito('Chaqueta Moderna',120,'https://images.unsplash.com/photo-1521223890158-f9f7c3d5d504?auto=format&fit=crop&w=800&q=80')">
Comprar
</button>

</div>
</div>

</section>

<div id="overlay" class="overlay" onclick="ocultarCarrito()"></div>

<div class="carrito" id="carrito">

<div class="carrito-header">
<h2>Tu carrito</h2>
<span class="cerrar" onclick="ocultarCarrito()">✕</span>
</div>

<div id="lista-carrito"></div>

<div class="resumen">

<div class="fila">
<span>Subtotal</span>
<span>S/ <span id="subtotal">0</span></span>
</div>

<div class="fila total">
<span>Total</span>
<span>S/ <span id="total">0</span></span>
</div>

<button class="btn-finalizar" onclick="comprarProductos()">
FINALIZA TU COMPRA
</button>

</div>
</div>

<footer>
© 2026 StyleStore - Todos los derechos reservados
</footer>

<script>

let carrito = [];
let total = 0;

function toggleLogin(){
    document.getElementById("loginDropdown")
    .classList.toggle("activo");
}

document.addEventListener("click", function(e){

    let menu =
    document.querySelector(".login-menu");

    if(!menu.contains(e.target)){
        document.getElementById("loginDropdown")
        .classList.remove("activo");
    }

});

function mostrarCarrito(){
    document.getElementById("carrito")
    .classList.add("activo");

    document.getElementById("overlay")
    .classList.add("activo");
}

function ocultarCarrito(){
    document.getElementById("carrito")
    .classList.remove("activo");

    document.getElementById("overlay")
    .classList.remove("activo");
}

function agregarCarrito(nombre,precio,imagen){

    carrito.push({
        nombre,
        precio,
        imagen
    });

    actualizarCarrito();
    mostrarCarrito();
}

function eliminarProducto(index){
    carrito.splice(index,1);
    actualizarCarrito();
}

function actualizarCarrito(){

    let lista =
    document.getElementById("lista-carrito");

    lista.innerHTML = "";

    total = 0;

    carrito.forEach((producto,index)=>{

        total += producto.precio;

        lista.innerHTML += `
        <div class="item-carrito">

            <img src="${producto.imagen}">

            <div class="info-producto">

                <h4>${producto.nombre}</h4>

                <p>Talla: M</p>

                <div class="precio-item">
                    S/ ${producto.precio}
                </div>

                <input
                type="number"
                value="1"
                min="1"
                class="cantidad">

            </div>

            <button
            class="btn-eliminar"
            onclick="eliminarProducto(${index})">
                🗑
            </button>

        </div>
        `;
    });

    document.getElementById("subtotal")
    .textContent = total;

    document.getElementById("total")
    .textContent = total;
}

function comprarProductos(){

    if(carrito.length===0){
        alert("El carrito está vacío");
        return;
    }

    alert("Compra realizada correctamente\n\nTotal: S/ " + total);

    carrito = [];
    actualizarCarrito();
    ocultarCarrito();
}

</script>

</body>
</html>
