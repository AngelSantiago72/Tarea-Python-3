<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>StyleStore - Tienda Moderna</title>

  <style>

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
    }

    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
    }

    .hero {
      background:
        linear-gradient(rgba(0,0,0,0.5),
        rgba(0,0,0,0.5)),
        url('https://images.unsplash.com/photo-1521335629791-ce4aec67dd47')
        center/cover;

      color: white;
      text-align: center;
      padding: 100px 20px;
    }

    .hero h2 {
      font-size: 40px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
      text-align: center;
    }

    .price {
      color: #27ae60;
      font-weight: bold;
    }

    button {
      background: black;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 6px;
    }

    button:hover {
      background: #333;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 15px;
    }

  </style>

</head>

<body>

<header>
  <h1>StyleStore</h1>

  <nav>
    <a href="#">Inicio</a>
    <a href="#">Tienda</a>
    <a href="#">Contacto</a>
  </nav>
</header>

<section class="hero">
  <h2>Descubre tu estilo</h2>
  <p>Moda moderna para todos</p>
</section>

<section class="products">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">

    <div class="card-content">
      <h3>Polera Urbana</h3>
      <p class="price">S/ 50</p>
      <button>Comprar</button>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1542272604-787c3835535d">

    <div class="card-content">
      <h3>Jeans Clásicos</h3>
      <p class="price">S/ 90</p>
      <button>Comprar</button>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1521223890158-f9f7c3d5d504">

    <div class="card-content">
      <h3>Chaqueta Moderna</h3>
      <p class="price">S/ 120</p>
      <button>Comprar</button>
    </div>
  </div>

</section>

<footer>
  <p>© 2026 StyleStore - Todos los derechos reservados</p>
</footer>

</body>

</html>
