<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleStore - Dashboard Admin</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#f5f5f5; }
        /* HEADER PUBLICO */
        header { background:#111; color:white; padding:20px 40px; display:flex; justify-content:space-between; align-items:center; }
        .btn-login { background:transparent; color:white; border:2px solid #d7261e; padding:10px 18px; border-radius:6px; cursor:pointer; font-weight:bold; }
        .login-dropdown { position:absolute; top:70px; right:40px; width:300px; background:#111; border-radius:10px; padding:20px; display:none; z-index:2000; box-shadow:0 10px 25px rgba(0,0,0,.4); }
        .login-dropdown.activo { display:block; }
        .login-dropdown input { width:100%; padding:12px; margin-bottom:15px; border:none; border-radius:5px; background:#222; color:white; }
        .btn-ingresar { width:100%; padding:12px; border:none; background:#d7261e; color:white; font-weight:bold; cursor:pointer; }
        
        /* DASHBOARD ADMIN */
        #panelDashboard { padding: 40px; background: #f0f2f5; min-height: 100vh; }
        .stats-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background:white; padding:20px; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .admin-nav { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn-tab { padding: 10px 20px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-tab.active { background: #111; color: white; border-color: #111; }
        .crud-table { width: 100%; border-collapse: collapse; background: #fff; }
        .crud-table th, .crud-table td { padding: 15px; border-bottom: 1px solid #eee; text-align: left; }
        .btn-action-edit { background: #ffb703; border: none; padding: 6px 14px; cursor: pointer; border-radius: 4px; margin-right: 5px; }
        .btn-action-del { background: #e63946; color: white; border: none; padding: 6px 14px; cursor: pointer; border-radius: 4px; }
        .btn-add-item { background: #2cb67d; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        /* ESTILOS ORIGINALES TIENDA */
        .hero { background: linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.4)), url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1400&q=80'); background-size:cover; padding:120px 20px; color:white; text-align:center; }
        .products { padding:40px; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:25px; }
        .card { background:white; border-radius:12px; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,.1); }
        .card img { width:100%; height:320px; object-fit:cover; }
        .card-content { padding:15px; text-align:center; }
        .price { color:#d7261e; font-size:24px; font-weight:bold; }
    </style>
</head>
<body>

<header id="headerPublico">
    <h1>StyleStore</h1>
    <button class="btn-login" onclick="toggleLogin()">Acceso Admin</button>
    <div class="login-dropdown" id="loginDropdown">
        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="clave" placeholder="Contraseña">
        <button class="btn-ingresar" onclick="login()">INGRESAR</button>
    </div>
</header>

<div id="seccionPublica">
    <section class="hero"><h2>Descubre tu estilo</h2></section>
    <section class="products" id="contenedorProductosTienda"></section>
</div>

<div id="panelDashboard" style="display:none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h2>Panel de Control</h2>
        <button onclick="location.reload()" style="background:#333; color:white; padding:10px 20px; border:none; cursor:pointer;">Cerrar Sesión</button>
    </div>
    <div class="stats-container">
        <div class="stat-card"><h3>Productos</h3><p id="totalProductos" style="font-size: 24px; font-weight: bold;"></p></div>
        <div class="stat-card"><h3>Clientes</h3><p id="totalClientes" style="font-size: 24px; font-weight: bold;"></p></div>
        <div class="stat-card"><h3>Usuarios</h3><p id="totalUsuarios" style="font-size: 24px; font-weight: bold;"></p></div>
    </div>
    <div style="background:white; padding:20px; border-radius:10px;">
        <div class="admin-nav">
            <button class="btn-tab active" onclick="cambiarPestana('productos', this)">Productos</button>
            <button class="btn-tab" onclick="cambiarPestana('clientes', this)">Clientes</button>
            <button class="btn-tab" onclick="cambiarPestana('usuarios', this)">Usuarios</button>
        </div>
        <div id="contenidoAdmin"></div>
    </div>
</div>

<script>
let BaseDatos = {
    productos: [{ id: 35, nombre: "Polera Urbana", precio: "50", email: "urban@style.com", telefono: "503-555-5555", ubicacion: "Sección A", hobby: "Nueva Colección", imagen: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80" }],
    clientes: [{ id: 1, nombre: "Jane", precio: "Smith", email: "js@gmail.com", telefono: "503-555-5555", ubicacion: "Portland", hobby: "Fotografía" }],
    usuarios: [{ id: 10, nombre: "Admin", precio: "Root", email: "admin@store.com", telefono: "999-999-999", ubicacion: "Lima", hobby: "Sistemas" }]
};
let seccionActual = "productos";

function toggleLogin() { document.getElementById("loginDropdown").classList.toggle("activo"); }

function login() {
    let u = document.getElementById("usuario").value;
    let c = document.getElementById("clave").value;
    if(u === "admin" && c === "1234") {
        document.getElementById("headerPublico").style.display = "none";
        document.getElementById("seccionPublica").style.display = "none";
        document.getElementById("panelDashboard").style.display = "block";
        actualizarResumen();
        renderizarTabla();
    } else { alert("Datos incorrectos"); }
}

function actualizarResumen() {
    document.getElementById("totalProductos").textContent = BaseDatos.productos.length;
    document.getElementById("totalClientes").textContent = BaseDatos.clientes.length;
    document.getElementById("totalUsuarios").textContent = BaseDatos.usuarios.length;
}

function renderizarTabla() {
    let datos = BaseDatos[seccionActual];
    let html = `<table class="crud-table"><thead><tr><th>ID</th><th>Nombre</th><th>Precio/Detalle</th><th>Acciones</th></tr></thead><tbody>`;
    datos.forEach((item, index) => {
        html += `<tr><td>${item.id}</td><td>${item.nombre}</td><td>${item.precio}</td>
                 <td><button class="btn-action-edit" onclick="editarItem(${index})">Editar</button>
                 <button class="btn-action-del" onclick="eliminarItem(${index})">Eliminar</button></td></tr>`;
    });
    html += `</tbody></table><br><button class="btn-add-item" onclick="agregarItem()">+ Agregar Registro</button>`;
    document.getElementById("contenidoAdmin").innerHTML = html;
}

function cambiarPestana(tipo, btn) {
    seccionActual = tipo;
    document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderizarTabla();
}

function agregarItem() {
    let nombre = prompt("Nombre:");
    if(!nombre) return;
    BaseDatos[seccionActual].push({id: Date.now(), nombre: nombre, precio: "0"});
    renderizarTabla();
    actualizarResumen();
}

function eliminarItem(index) {
    BaseDatos[seccionActual].splice(index, 1);
    renderizarTabla();
    actualizarResumen();
}

function editarItem(index) {
    let nuevo = prompt("Editar nombre:", BaseDatos[seccionActual][index].nombre);
    if(nuevo) BaseDatos[seccionActual][index].nombre = nuevo;
    renderizarTabla();
}

// Inicialización
document.addEventListener("DOMContentLoaded", () => {
    // Aquí puedes añadir tu lógica de renderizado de tienda si deseas
});
</script>
</body>
</html>
