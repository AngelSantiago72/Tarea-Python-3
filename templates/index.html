<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StyleStore - Tienda Moderna</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#111;
    color:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:28px;
}

nav{
    display:flex;
    align-items:center;
    gap:20px;
}

nav a{
    color:white;
    text-decoration:none;
}

#btnCarrito{
    background:#27ae60;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.hero{
    background:
    linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)),
    url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1400&q=80');
    background-size:cover;
    background-position:center;
    color:white;
    text-align:center;
    padding:120px 20px;
}

.hero h2{
    font-size:50px;
    margin-bottom:10px;
}

.hero p{
    font-size:20px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:40px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card-content{
    padding:15px;
    text-align:center;
}

.price{
    color:#27ae60;
    font-size:20px;
    font-weight:bold;
}

button{
    background:black;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#333;
}

/* CARRITO */

.carrito{
    position:fixed;
    top:0;
    right:-400px;
    width:350px;
    height:100%;
    background:white;
    box-shadow:-4px 0 10px rgba(0,0,0,0.2);
    padding:20px;
    transition:0.4s;
    overflow-y:auto;
    z-index:1000;
}

.carrito.activo{
    right:0;
}

.carrito h2{
    margin-bottom:20px;
}

#lista-carrito{
    list-style:none;
}

#lista-carrito li{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.total{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

.botones-carrito{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.comprar{
    background:#27ae60;
}

.cancelar{
    background:#e74c3c;
}

.modificar{
    background:#f39c12;
}

.eliminar{
    background:#c0392b;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

</style>
</head>
<body>

<header>

    <h1>StyleStore</h1>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Tienda</a>
        <a href="#">Contacto</a>

        <button id="btnCarrito" onclick="mostrarCarrito()">
            🛒 Carrito
        </button>
    </nav>

</header>

<section class="hero">
    <h2>Descubre tu estilo</h2>
    <p>Moda moderna para todos</p>
</section>

<section class="products">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80">

        <div class="card-content">
            <h3>Polera Urbana</h3>
            <p class="price">S/ 50</p>

            <button onclick="agregarCarrito('Polera Urbana',50)">
                Comprar
            </button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=800&q=80">

        <div class="card-content">
            <h3>Jeans Clásicos</h3>
            <p class="price">S/ 90</p>

            <button onclick="agregarCarrito('Jeans Clásicos',90)">
                Comprar
            </button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1521223890158-f9f7c3d5d504?auto=format&fit=crop&w=800&q=80">

        <div class="card-content">
            <h3>Chaqueta Moderna</h3>
            <p class="price">S/ 120</p>

            <button onclick="agregarCarrito('Chaqueta Moderna',120)">
                Comprar
            </button>
        </div>
    </div>

</section>

<!-- CARRITO -->

<div class="carrito" id="carrito">

    <h2>🛒 Carrito de Compras</h2>

    <ul id="lista-carrito"></ul>

    <div class="total">
        Total: S/ <span id="total">0</span>
    </div>

    <div class="botones-carrito">

        <button class="modificar" onclick="modificarProducto()">
            Modificar Último Producto
        </button>

        <button class="eliminar" onclick="eliminarProducto()">
            Eliminar Último Producto
        </button>

        <button class="comprar" onclick="comprarProductos()">
            Finalizar Compra
        </button>

        <button class="cancelar" onclick="ocultarCarrito()">
            Cancelar
        </button>

    </div>

</div>

<footer>
    <p>© 2026 StyleStore - Todos los derechos reservados</p>
</footer>

<script>

let total = 0;
let carrito = [];

function mostrarCarrito(){
    document.getElementById("carrito").classList.add("activo");
}

function ocultarCarrito(){
    document.getElementById("carrito").classList.remove("activo");
}

function agregarCarrito(nombre,precio){

    carrito.push({
        nombre:nombre,
        precio:precio
    });

    actualizarCarrito();
}

function actualizarCarrito(){

    let lista = document.getElementById("lista-carrito");

    lista.innerHTML = "";

    total = 0;

    carrito.forEach(producto => {

        let li = document.createElement("li");

        li.textContent =
        producto.nombre + " - S/ " + producto.precio;

        lista.appendChild(li);

        total += producto.precio;
    });

    document.getElementById("total").textContent = total;
}

function eliminarProducto(){

    if(carrito.length > 0){

        carrito.pop();

        actualizarCarrito();

    }else{

        alert("El carrito está vacío");
    }
}

function modificarProducto(){

    if(carrito.length > 0){

        let nuevoNombre =
        prompt("Nuevo nombre del último producto:");

        if(nuevoNombre){

            carrito[carrito.length-1].nombre =
            nuevoNombre;

            actualizarCarrito();
        }

    }else{

        alert("El carrito está vacío");
    }
}

function comprarProductos(){

    if(carrito.length === 0){

        alert("No hay productos en el carrito");

        return;
    }

    alert(
        "Compra realizada correctamente.\n\nTotal: S/ " +
        total
    );

    carrito = [];

    actualizarCarrito();

    ocultarCarrito();
}

</script>

</body>
</html>
